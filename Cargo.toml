[package]
name = "wrela_prism"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
meshopt = "0.6"
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = { version = "28", features = ["wgsl"] }
winit = "0.30"

[features]
cpu_dag_cut = []

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
debug = 0
split-debuginfo = "off"
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false
